# Shared infrastructure for the NFS-e automation POC.
# All credentials below are local, fake and for demo purposes only.
name: nfse-automation-poc

services:
  # Portal da Contabilidade: creates Solicitações de Emissão and dispatches IssueNfse via the outbox.
  accounting-portal:
    build: ./services/accounting-portal
    ports:
      - "3000:3000" # http://localhost:3000
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/accounting
      RABBITMQ_URL: amqp://poc:poc@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: http://localhost:15672 (poc / poc)
    volumes:
      # Users and topology (robot.issue-nfse queue, nfse.events exchange) live in the definitions file.
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/10-definitions.conf:/etc/rabbitmq/conf.d/10-definitions.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
    volumes:
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Healthy only once both service databases exist.
      test: ["CMD-SHELL", "psql -U poc -d accounting -c 'select 1' && psql -U poc -d city_hall -c 'select 1'"]
      interval: 5s
      timeout: 5s
      retries: 12

  # S3-compatible object storage for the claim check (ADR 0004).
  object-storage:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333" # S3 API
    volumes:
      - ./infra/object-storage/s3.json:/etc/seaweedfs/s3.json:ro
      - object-storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24

  # One-shot job creating the NFS-e documents bucket.
  object-storage-init:
    image: chrislusf/seaweedfs:3.97
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: ["sh", "-c", "echo 's3.bucket.create -name nfse-documents' | weed shell -master=object-storage:9333"]
    restart: "no"

  # Fake Portal da Prefeitura: web only, never connects to RabbitMQ (ADR 0001).
  city-hall-portal:
    build: ./services/city-hall-portal
    ports:
      - "3001:3001" # http://localhost:3001
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/city_hall
      SESSION_SECRET: local-demo-session-secret
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/login || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  postgres-data:
  object-storage-data:
