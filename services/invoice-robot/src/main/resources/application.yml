spring:
  application:
    name: invoice-robot
  main:
    banner-mode: off
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:poc}
    password: ${RABBITMQ_PASSWORD:poc}
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: auto
        # Concurrent issuances per robot instance: one consumer thread (and browser) each, one unacked
        # command per consumer. Scale further by running more instances (competing consumers).
        prefetch: 1
        concurrency: ${ROBOT_CONCURRENCY:3}
        max-concurrency: ${ROBOT_CONCURRENCY:3}
        # Page failures are handled by RetryScheduler. Unexpected errors (e.g. no broker confirm) are retried
        # in-process with backoff, then the command is parked in the DLQ (RabbitConfig#parkInDeadLetterQueue).
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

robot:
  city-hall-url: ${CITY_HALL_URL:http://localhost:3001}
  credentials-file: ${CREDENTIALS_FILE:../../infra/robot/credentials.json}
  headless: ${HEADLESS:true}
  navigation-timeout: ${NAVIGATION_TIMEOUT:15s}
  # Backoff before retry 1, 2 and 3 (matches robot.issue-nfse.retry-1..3 in infra/rabbitmq/definitions.json).
  retry-delays: ${RETRY_DELAYS:10s,1m,5m}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:nfse-documents}
    access-key: ${S3_ACCESS_KEY:poc-access-key}
    secret-key: ${S3_SECRET_KEY:poc-secret-key}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level ${HOSTNAME:-robot} [%thread] [%X{correlationId:-}] %logger{20} - %msg%n"
