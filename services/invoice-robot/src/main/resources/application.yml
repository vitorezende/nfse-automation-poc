spring:
  application:
    name: invoice-robot
  main:
    banner-mode: off
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:poc}
    password: ${RABBITMQ_PASSWORD:poc}
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        concurrency: 1
        # Page failures are handled by RetryScheduler; an unexpected infrastructure error (e.g. no broker
        # confirm) leaves the command on the queue. Contract violations are rejected without requeue.
        default-requeue-rejected: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

robot:
  city-hall-url: ${CITY_HALL_URL:http://localhost:3001}
  credentials-file: ${CREDENTIALS_FILE:../../infra/robot/credentials.json}
  headless: ${HEADLESS:true}
  navigation-timeout: ${NAVIGATION_TIMEOUT:15s}
  # Backoff before retry 1, 2 and 3 (matches robot.issue-nfse.retry-1..3 in infra/rabbitmq/definitions.json).
  retry-delays: ${RETRY_DELAYS:10s,1m,5m}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{20} - %msg%n"
