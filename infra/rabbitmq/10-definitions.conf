# Topology (queues, exchanges, bindings) is infrastructure: declared here, used by the services.
# Commands published before the robot ever connects are therefore never dropped as unroutable.
load_definitions = /etc/rabbitmq/definitions.json

# Retries: the robot republishes a transiently failed command to robot.issue-nfse.retry-N with a per-message
# expiration (its backoff delay). On expiry the message is dead-lettered back to robot.issue-nfse.
# Commands that exhaust their retries are parked in robot.issue-nfse.dlq for auditing.
